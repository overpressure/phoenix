# Every pull request, every push to main, and every release before it is made (release.yml): overpressure's
# checks of a headset repository (its headset-ci.yml: the tests on each host system, lint, the shell and C tests,
# the documents, private data, the workflows), with the PICO 4's pinned kernel release and its contracts. One run
# per content: a tree that passed against overpressure's main of the time is not tested again.
# The job ci is the one required check: it passes when every check passed or was skipped for that reason.
name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  checks:
    uses: overpressure/overpressure/.github/workflows/headset-ci.yml@main
    with:
      codename: phoenix
      kernel: true
    permissions:
      contents: read
      actions: read # an earlier pass of the same tree

  ci:
    needs: checks
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every check passed or was reused
        env:
          RESULT: ${{ needs.checks.result }}
        run: |
          echo "checks: $RESULT"
          [ "$RESULT" = success ]
