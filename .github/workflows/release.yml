# A release from its tag (docs/releasing.md): a pushed tag YYYY.M.PATCH[bN] that is headset.json's version runs
# every CI check on the tagged commit (skipped when its tree passed against the same overpressure already), then
# overpressure's headset-release.yml makes the GitHub release overpressure downloads (python -m overpressure
# headset add phoenix): notes and changelog, the source zip and its checksum, nothing else attached
# (docs/distribution.md); then it closes the issues the release brings.
name: Release
on:
  push:
    tags: ["20[0-9][0-9].*"] # calendar versions (docs/releasing.md); v1.0-beta.N were before them

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      actions: read # an earlier pass of the same tree

  release:
    needs: checks
    uses: overpressure/overpressure/.github/workflows/headset-release.yml@main
    permissions:
      contents: write
      pull-requests: read # the notes name each change's pull request and its author
      issues: write # the issues it releases are closed
